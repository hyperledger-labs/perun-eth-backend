version: "2"

run:
  timeout: 2m

  # Do not change go.{mod,sum}.
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Disabled as a style choice:
    - wrapcheck # We do not rewrap all errors from other packages.
    - varnamelen # We often use single letter arguments.
    - exhaustruct # We often have uninitialized fields of structs.
    - errorlint # We have interface errors which an impl needs to return.
    - lll # We use long lines.
    - gochecknoglobals # We have a lot of globals.
    - nlreturn # "new line before return"; not useful.
    - paralleltest # We like parallel tests.
    - ireturn # We often return interfaces.
    - depguard # We do not enforce package-layer import restrictions in this repo.
    - embeddedstructfieldcheck # Embedded field ordering is not a style goal here.
    - contextcheck # Test helpers and integration APIs do not consistently thread contexts.
    - copyloopvar # Avoid repo-wide loop capture churn for Go 1.22 semantics.
    - cyclop # Existing integration paths are intentionally more complex than the default threshold.
    - funcorder # Declaration ordering churn is not useful here.
    - gocognit # Existing coordination code is intentionally branchy.
    - iotamixing # Constant block style is not enforced here.
    - funlen # Some integration helpers are intentionally longer than the default limit.
    - perfsprint # Tiny string formatting micro-optimizations are not a priority here.
    - prealloc # Slice preallocation hints are not enforced across the repo.
    - recvcheck # Mixed receiver styles are tolerated in existing types.
    - wsl # Formatting disabled for now.
    - gochecknoinits # We use init functions.
    - inamedparam # Interface parameter names add little value here.
    - intrange # Avoid repo-wide syntax churn for range-over-int rewrites.
    - mnd # Literal extraction would create low-signal churn in tests and protocol code.
    - modernize # Avoid broad syntax modernization unrelated to behavior.
    - nakedret # We tolerate existing short naked returns in internal helpers.
    - nestif # Deep control flow exists in chain/test orchestration paths.
    - noinlineerr # Inline error checks are acceptable in this codebase.
    - nolintlint # Legacy nolint tags exist and are not worth broad cleanup churn.
    - nonamedreturns # Named returns are used pervasively in existing code.
    - revive # Parameter naming and similar style checks are not enforced repo-wide.
    - testifylint # Existing concurrent test helpers do not follow all testify style rules.
    - whitespace # Whitespace micro-style is not enforced here.
    - wsl_v5 # Statement cuddling rules would cause broad formatting churn.
    - err113 # We don't require static errors.

    # These could be enabled in the future:
    - tparallel # We don't always use parallel tests.

    # Deprecated:
  settings:
    cyclop:
      # 15 is used by go-report-card as well.
      max-complexity: 15
    goheader:
      values:
        regexp:
          ANY_YEAR: "20(19|20|21|22|23|24|25|26)" # 2019-2026
      template-path: .copyright-header
    forbidigo:
      forbid:
        # Forbid functions to start with "get" or "Get".
        - pattern: ^[Gg]et.*$
        - pattern: ^[Ee]quals$
        # Default values:
        - pattern: ^print.*$
        - pattern: 'fmt\.Print.*'
  exclusions:
    paths:
      - bindings/
    presets:
      - comments
    rules:
      - path: test
        linters:
          # We often have long test or test helper functions.
          - funlen
          # Can use panicing interface casts.
          - forcetypeassert
          # Can create dynamic errors with errors.New.
          - err113

      # We always use testing.T as first argument in testing functions,
      # therefore disable the "context must be the first argument" check in tests.
      - path: test
        linters: [revive]
        text: "context-as-argument"

      - linters: [gosec]
        text: "G115:"
